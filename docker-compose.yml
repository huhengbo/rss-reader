services:
  rss-reader:
    image: ${RSS_READER_IMAGE:-ghcr.io/huhengbo/rss-reader:latest}
    restart: unless-stopped
    ports:
      - "${RSS_READER_PORT:-9898}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      RSS_READER_CONFIG: /app/config.json
      RSS_READER_ARCHIVES: /data/archives.txt
    volumes:
      - ./config.json:/app/config.json:ro
      - rss-reader-data:/data

volumes:
  rss-reader-data:
