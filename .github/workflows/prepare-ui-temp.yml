name: Prepare UI branch (temporary)
on:
  push:
    branches: [feat/reader-ui]
permissions:
  contents: write
concurrency:
  group: prepare-reader-ui
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: Generate lockfile and format Go
        run: |
          npm install --package-lock-only --ignore-scripts
          gofmt -w internal
          git add package-lock.json internal
          if git diff --cached --quiet; then exit 0; fi
          current=$(git ls-remote origin refs/heads/feat/reader-ui | cut -f1)
          if [ "$current" != "$GITHUB_SHA" ]; then echo 'Branch advanced; leave newer run to prepare it'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: generate UI test lockfile and format Go'
          git push origin HEAD:feat/reader-ui
