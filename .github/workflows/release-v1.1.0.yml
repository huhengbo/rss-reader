name: Release v1.1.0 once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v1.1.0.yml"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-v1.1.0-once
  cancel-in-progress: false

jobs:
  release:
    name: Publish v1.1.0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trigger commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create immutable release tag
        shell: bash
        env:
          TARGET_SHA: 20ba1e2c7c5b59256a4f044e47d82e9c6900dc67
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin refs/tags/v1.1.0 >/dev/null 2>&1; then
            remote_sha="$(git rev-list -n 1 refs/tags/v1.1.0 2>/dev/null || true)"
            if [ -n "$remote_sha" ] && [ "$remote_sha" != "$TARGET_SHA" ]; then
              echo "v1.1.0 already points to a different commit" >&2
              exit 1
            fi
          else
            git tag -a v1.1.0 "$TARGET_SHA" -m "v1.1.0"
            git push origin refs/tags/v1.1.0
          fi
          git checkout --detach "$TARGET_SHA"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_release_notes.py --version "1.1.0" --output release-notes.md
          cat release-notes.md

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=1.1.0
            type=raw,value=1.1
            type=raw,value=1
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=RSS Reader
            org.opencontainers.image.description=Minimal RSS dashboard with keyword notifications
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=20ba1e2c7c5b59256a4f044e47d82e9c6900dc67
            org.opencontainers.image.version=1.1.0

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.1.0 >/dev/null 2>&1; then
            gh release edit v1.1.0 --title v1.1.0 --notes-file release-notes.md
          else
            gh release create v1.1.0 --verify-tag --title v1.1.0 --notes-file release-notes.md
          fi
