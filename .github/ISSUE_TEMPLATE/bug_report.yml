name: Bug report
description: 报告可复现的问题
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿在公开 Issue 中粘贴 token、webhook、私有 Feed URL 或其他凭据。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？
      placeholder: 清楚描述问题和影响。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 使用配置...
        2. 启动...
        3. 访问...
        4. 出现...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本 / Commit
      placeholder: v1.2.3 或 commit SHA
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: 运行方式
      options:
        - Docker / Docker Compose
        - 本地 Go
        - 其他
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: OS、CPU 架构、Docker/Go 版本等。请先移除敏感信息。
      placeholder: Linux amd64, Docker 28.x
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 只提供与问题相关且已脱敏的日志。
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认当前 main / 最新版本仍可复现。
          required: true
        - label: 我已移除 token、webhook、认证参数和其他敏感信息。
          required: true
