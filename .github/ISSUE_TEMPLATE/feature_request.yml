name: Feature request
description: 提议明确、可维护的新功能
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 先描述要解决的问题，而不是实现方案。
      placeholder: 当前在什么场景下遇到了什么限制？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明最小可行的行为变化。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 是否可以通过现有配置或更简单方式完成？

  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性影响
      description: 是否会改变配置、API、关键词语义、Docker 部署或现有行为？

  - type: checkboxes
    id: principles
    attributes:
      label: 维护性确认
      options:
        - label: 该需求有当前明确使用场景，而不是为未来假设预留扩展。
          required: true
        - label: 我已检查现有 Issue，没有明显重复项。
          required: true
