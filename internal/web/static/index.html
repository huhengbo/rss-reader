<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="<<.Snapshot.Description>>">
  <meta name="author" content="huhengbo">
  <title><<.Snapshot.Title>></title>
  <script src="/static/preferences.js"></script>
  <link rel="stylesheet" href="/static/themes.css">
  <link rel="stylesheet" href="/static/app.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳到订阅内容</a>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="RSS Reader 首页"><span class="brand-mark" aria-hidden="true">R</span><span>RSS Reader<small>轻量 · 自托管</small></span></a>
      <nav class="enhanced-only" aria-label="订阅源">
        <p class="nav-caption">我的订阅</p>
        <div id="source-nav"></div>
      </nav>
      <p class="sidebar-note">信息有序，阅读从容。<br>订阅内容来自你配置的来源。</p>
    </aside>
    <main id="main" tabindex="-1" style="--list-height: <<.Snapshot.ListHeight>>px">
      <header class="page-header">
        <div><p class="eyebrow">YOUR DAILY READING</p><h1 id="page-title"><<.Snapshot.Title>></h1><p class="page-description" id="page-description"><<.Snapshot.Description>></p></div>
        <div class="stats"><strong id="source-count"><<len .Snapshot.Sources>></strong><span>订阅源</span></div>
      </header>
      <section class="appearance enhanced-only" aria-label="阅读外观">
        <label>皮肤<select id="skin"><option value="slate">Slate · 简洁工作台</option><option value="paper">Paper · 纸感阅读</option><option value="grove">Grove · 柔和自然</option><option value="terminal">Terminal · 终端风格</option></select></label>
        <label>明暗<select id="mode"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label>
        <label>密度<select id="density"><option value="comfortable">舒适</option><option value="compact">紧凑</option></select></label>
      </section>
      <div class="toolbar enhanced-only" role="search" aria-label="筛选订阅内容">
        <label class="search-wrap"><span class="sr-only">搜索文章或订阅源</span><input id="search" type="search" placeholder="搜索文章或订阅源" autocomplete="off" maxlength="500"></label>
        <button id="clear-search" type="button">清空</button>
        <label class="filter-label"><span class="sr-only">筛选订阅源</span><select id="source-filter"><option value="">全部订阅源</option></select></label>
        <button id="refresh-view" type="button" title="读取服务器的最新缓存，不触发外部 RSS 抓取">刷新视图</button>
      </div>
      <div class="status-row enhanced-only">
        <p id="connection" role="status" aria-live="polite">正在连接…</p>
        <p id="result-count" role="status" aria-live="polite"></p>
      </div>
      <div id="updates" class="notice enhanced-only" hidden><p id="update-text" role="status" aria-live="polite"></p><button id="apply-updates" type="button">应用更新</button></div>
      <p id="page-error" class="notice warning" role="status" hidden></p>
      <section aria-label="订阅内容">
        <div id="sources" class="feed-grid"><<range .Snapshot.Sources>><<template "source" .>><<end>></div>
        <div id="empty-state" class="empty-state" <<if .Snapshot.Sources>>hidden<<end>>><h2 id="empty-title">还没有订阅源</h2><p id="empty-description">请在配置文件的 values 中添加订阅源。</p></div>
      </section>
      <noscript><p class="notice">JavaScript 未启用，当前为静态阅读模式。重新打开页面可获取最新缓存。</p></noscript>
      <footer class="page-footer"><span>RSS Reader · 信息由订阅源提供</span><span>基于 <a href="https://github.com/srcrs/rss-reader" target="_blank" rel="noopener noreferrer">srcrs/rss-reader</a> · <a href="https://github.com/huhengbo/rss-reader" target="_blank" rel="noopener noreferrer">huhengbo 维护</a></span></footer>
    </main>
  </div>
  <template id="source-template"><<template "source" .BlankSource>></template>
  <template id="item-template"><<template "item" .BlankItem>></template>
  <script id="initial-data" type="application/json"><<.Snapshot>></script>
</body>
</html>
<<define "source">>
<article class="feed-card" data-id="<<.ID>>" aria-labelledby="heading-<<.ID>>">
  <header class="card-header">
    <span class="feed-avatar" aria-hidden="true">RSS</span>
    <div class="card-heading"><h2 id="heading-<<.ID>>" data-part="title"><<.Title>></h2><span class="source-state" data-status="<<.Status>>"><<statusText .Status>></span></div>
    <button class="collapse enhanced-only" data-action="collapse" type="button" aria-label="折叠 <<.Title>>" aria-expanded="true" aria-controls="body-<<.ID>>">−</button>
  </header>
  <div class="card-body" id="body-<<.ID>>">
    <p class="source-message" <<if not .Message>>hidden<<end>>><<.Message>></p>
    <div class="skeleton" <<if ne .Status "loading">>hidden<<end>> aria-hidden="true"><i></i><i></i><i></i></div>
    <ul class="article-list" role="list"><<range .Items>><<template "item" .>><<end>></ul>
    <button class="more enhanced-only" data-action="more" type="button" <<if le (len .Items) 8>>hidden<<end>>>展开更多</button>
    <p class="empty-source" <<if .Items>>hidden<<end>>>当前没有可展示的文章</p>
    <div class="card-footer"><span>最近成功同步 <time data-part="success" datetime="<<.LastSuccessAt>>"><<if .LastSuccessAt>><<.LastSuccessAt>><<else>>尚未成功<<end>></time></span><span>内容变更 <time data-part="changed" datetime="<<.ContentChangedAt>>"><<if .ContentChangedAt>><<.ContentChangedAt>><<else>>—<<end>></time></span></div>
  </div>
</article>
<<end>>
<<define "item">>
<li data-item-id="<<.ID>>"><a class="article-link" <<if .Link>>href="<<.Link>>"<<end>> target="_blank" rel="noopener noreferrer"><span class="article-title"><<.Title>></span><time class="item-time" datetime="<<.PublishedAt>>" <<if not .PublishedAt>>hidden<<end>>><<.PublishedAt>></time></a></li>
<<end>>
